<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sharko Auth Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg,#667eea,#764ba2);
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      color: #111;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      color: #667eea;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.3rem;
    }
    input, select {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 1rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg,#667eea,#764ba2);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 350px;
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      background: #0f172a;
      color: #4ade80;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🦈 Sharko Auth Generator</h1>
  <p style="text-align:center;color:#555;">
    Fill out the options below to generate a working authentication snippet.
  </p>

  <div class="grid">
    <div>
      <label>App / Website Name</label>
      <input id="appName" placeholder="My Awesome App" />
    </div>

    <div>
      <label>Login Method</label>
      <select id="authType">
        <option value="email">Email</option>
        <option value="username">Username</option>
        <option value="phone">Phone</option>
      </select>
    </div>

    <div>
      <label>Backend Endpoint</label>
      <input id="endpoint" placeholder="/api/login" />
    </div>

    <div>
      <label>Options</label>
      <div class="checkbox">
        <input type="checkbox" id="rememberMe" checked />
        <span>Remember Me</span>
      </div>
      <div class="checkbox">
        <input type="checkbox" id="passwordReset" checked />
        <span>Password Reset</span>
      </div>
    </div>
  </div>

  <button onclick="generate()">Generate Authentication Code</button>

  <textarea id="output" placeholder="Your generated code will appear here..."></textarea>
</div>

<script>
function generate() {
  const app = document.getElementById("appName").value || "My App";
  const auth = document.getElementById("authType").value;
  const endpoint = document.getElementById("endpoint").value || "/api/login";
  const remember = document.getElementById("rememberMe").checked;
  const reset = document.getElementById("passwordReset").checked;

  const type =
    auth === "email" ? "email" :
    auth === "phone" ? "tel" : "text";

  document.getElementById("output").value =
`<!-- Sharko Auth Login -->
<div id="sharko-login"></div>

<style>
#sharko-login {
  max-width: 380px;
  margin: auto;
  font-family: sans-serif;
  background: white;
  padding: 2rem;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
#sharko-login h2 {
  text-align: center;
  color: #667eea;
}
#sharko-login input, button {
  width: 100%;
  padding: 0.75rem;
  margin-top: 0.8rem;
}
button {
  background: linear-gradient(135deg,#667eea,#764ba2);
  border: none;
  color: white;
  font-weight: bold;
  border-radius: 8px;
}
</style>

<div id="sharko-login">
  <h2>${app}</h2>

  <input id="user" type="${type}" placeholder="Enter ${auth}" />
  <input id="pass" type="password" placeholder="Password" />

  ${remember ? `
  <label>
    <input type="checkbox" id="rem" /> Remember me
  </label>` : ``}

  <button onclick="login()">Sign In</button>

  ${reset ? `<p><a href="#">Forgot password?</a></p>` : ``}
</div>

<script>
function login() {
  fetch("${endpoint}", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      user: document.getElementById("user").value,
      pass: document.getElementById("pass").value,
      ${remember ? "rem: document.getElementById('rem').checked" : ""}
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) alert("Login successful!");
    else alert("Login failed");
  });
}
<\/script>`;
}
</script>

</body>
</html>
